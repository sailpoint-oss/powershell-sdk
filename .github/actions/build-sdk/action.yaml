name: "Build PowerShell SDK"
description: "Build all API versions of the PowerShell SDK from OpenAPI specs"

inputs:
  api-specs-path:
    description: "Path to the checked-out api-specs repository"
    required: false
    default: "api-specs"
  skip-tests:
    description: "Skip running tests after building"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Node dependencies
      shell: bash
      run: npm install

    - name: Download OpenAPI Generator
      shell: bash
      run: |
        wget -q https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.12.0/openapi-generator-cli-7.12.0.jar -O openapi-generator-cli.jar

    - name: Build Versioned SDK (per-partition)
      shell: bash
      run: |
        node sdk-resources/build-versioned-sdk.js \
          ${{ inputs.api-specs-path }}/idn/apis

    - name: Build NERM SDK
      shell: bash
      run: |
        rm -rf ./PSSailpoint/nerm
        java -jar openapi-generator-cli.jar generate \
          -i ${{ inputs.api-specs-path }}/nerm/openapi.yaml \
          -g powershell -o PSSailpoint/nerm \
          --global-property skipFormModel=false,apiDocs=true,modelDocs=true \
          --config sdk-resources/nerm-config.yaml
        node sdk-resources/postscript.js ./PSSailpoint/nerm

    - name: Build NERM V2025 SDK
      shell: bash
      run: |
        rm -rf ./PSSailpoint/nermV2025
        java -jar openapi-generator-cli.jar generate \
          -i ${{ inputs.api-specs-path }}/nerm/v2025/v2025.yaml \
          -g powershell -o PSSailpoint/nermV2025 \
          --global-property skipFormModel=false,apiDocs=true,modelDocs=true \
          --config sdk-resources/v2025-nerm-config.yaml
        node sdk-resources/postscript.js ./PSSailpoint/nermV2025

    - name: Run Build Scripts
      shell: pwsh
      run: |
        # Build per-partition modules (dynamically discovered)
        Get-ChildItem -Path './PSSailpoint' -Directory |
          Where-Object { $_.Name -notin @('nerm', 'nermV2025') -and (Test-Path (Join-Path $_.FullName 'src')) } |
          ForEach-Object {
            $buildScript = Join-Path $_.FullName 'Build.ps1'
            if (Test-Path $buildScript) { & $buildScript }
          }
        # Build NERM modules
        ./PSSailpoint/nerm/Build.ps1
        ./PSSailpoint/nermV2025/Build.ps1
        # Build root barrel module manifest
        ./PSSailpoint/Build.ps1

    # Import the module from an installed package, the way customers get it.
    # Packaging can drop files that the git checkout has, for example files
    # whose names start with a dot. The publish goes to a local folder on the
    # runner only. Nothing goes to the PowerShell Gallery.
    - name: Test Installed Package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $Repo = Join-Path $env:RUNNER_TEMP 'local-psrepo'
        $Installed = Join-Path $env:RUNNER_TEMP 'installed-modules'
        New-Item -ItemType Directory -Force -Path $Repo, $Installed | Out-Null
        Register-PSResourceRepository -Name LocalPackageTest -Uri $Repo -Trusted
        try {
          Publish-PSResource -Path ./PSSailpoint -Repository LocalPackageTest
          Save-PSResource -Name PSSailpoint -Repository LocalPackageTest -Path $Installed -TrustRepository
        } finally {
          Unregister-PSResourceRepository -Name LocalPackageTest
        }
        # Expect one loaded module for each partition that the barrel module imports.
        $Expected = (Select-String -Path ./PSSailpoint/PSSailpoint.psm1 -Pattern '^Import-Module ').Count
        $Root = Join-Path $Installed 'PSSailpoint'
        pwsh -NoProfile -Command "
          `$ErrorActionPreference = 'Stop'
          Import-Module '$Root'
          `$Loaded = (Get-Module -Name 'PSSailpoint.*').Count
          if (`$Loaded -ne $Expected) { throw `"Expected $Expected partition modules, loaded `$Loaded`" }
          `"Installed package loaded `$Loaded partition modules`"
        "
        if ($LASTEXITCODE -ne 0) { throw 'The installed PSSailpoint package failed to load.' }

    - name: Import Modules and Run Tests
      shell: pwsh
      run: |
        # Import all partition modules via the barrel module
        Import-Module -Name './PSSailpoint/PSSailpoint' -Verbose
        # Import NERM modules (not included in the partition barrel)
        Import-Module -Name './PSSailpoint/nerm/src/PSSailpoint.NERM' -Verbose
        Import-Module -Name './PSSailpoint/nermV2025/src/PSSailpoint.NERMV2025' -Verbose
        . ./PSSailpoint/Configuration.ps1
        . ./PSSailpoint/Pagination.ps1
        if ("${{ inputs.skip-tests }}" -ne "true") {
          Install-Module -Name Pester -Force
          Invoke-Pester -Output Detailed ./PSSailpoint/tests/
        }
