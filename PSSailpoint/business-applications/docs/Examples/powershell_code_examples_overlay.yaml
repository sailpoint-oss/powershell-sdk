- path: /business-applications/v1/{id}
  method: PATCH
  xCodeSample:
    - lang: PowerShell
      label: SDK_tools/sdk/powershell/businessapplications/methods/business-applications#update-business-application-v1
      source: |
        $Id = "a1b2c3d4-e5f6-7890-abcd-ef1234567890" # String | Business Application ID.
        $XSailPointExperimental = "true" # String | Use this header to enable this experimental API. (default to "true")
        $JsonPatchOperation = @"{
          "op" : "replace",
          "path" : "/description",
          "value" : "New description"
        }"@ $JsonPatchOperation = @"{
          "op" : "replace",
          "path" : "/description",
          "value" : "New description"
        }"@ 
        
        
        # Update Business Application
        
        try {
            $Result = ConvertFrom-JsonToJsonPatchOperation -Json $JsonPatchOperation
