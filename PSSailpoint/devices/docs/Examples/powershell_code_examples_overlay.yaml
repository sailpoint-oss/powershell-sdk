- path: /devices/v1/device-counts
  method: GET
  xCodeSample:
    - lang: PowerShell
      label: SDK_tools/sdk/powershell/devices/methods/devices#get-device-counts-v1
      source: |
        $XSailPointExperimental = "true" # String | Use this header to enable this experimental API. (default to "true")
        
        # Get device counts
        
        try {
            Get-DeviceCountsV1 -XSailPointExperimental $XSailPointExperimental 
    
            # Below is a request that includes all optional parameters
            # Get-DeviceCountsV1 -XSailPointExperimental $XSailPointExperimental   
        } catch {
            Write-Host $_.Exception.Response.StatusCode.value__ "Exception occurred when calling Get-DeviceCountsV1"
            Write-Host $_.ErrorDetails
        }
