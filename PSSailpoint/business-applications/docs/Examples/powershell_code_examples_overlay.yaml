- path: /business-applications/v1
  method: POST
  xCodeSample:
    - lang: PowerShell
      label: SDK_tools/sdk/powershell/businessapplications/methods/business-applications#create-business-application-v1
      source: |
        $BusinessApplication = @"
        {
          "owner" : {
            "name" : "William Wilson",
            "id" : "2c91808568c529c60168cca6f90c1313",
            "type" : "IDENTITY"
          },
          "vendor" : "Cursor",
          "created" : "2026-01-15T13:45:12.312Z",
          "origin" : "",
          "name" : "Cursor",
          "description" : "AI coding assistant used by the platform engineering team.",
          "modified" : "2026-02-20T09:31:47.882Z",
          "id" : "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
          "source" : {
            "name" : "William Wilson",
            "id" : "2c91808568c529c60168cca6f90c1313",
            "type" : "IDENTITY"
          },
          "signatures" : [ {
            "name" : "cursor",
            "type" : "AI Agent"
          }, {
            "name" : "cursor",
            "type" : "AI Agent"
          } ],
          "additionalOwners" : [ {
            "name" : "William Wilson",
            "id" : "2c91808568c529c60168cca6f90c1313",
            "type" : "IDENTITY"
          }, {
            "name" : "William Wilson",
            "id" : "2c91808568c529c60168cca6f90c1313",
            "type" : "IDENTITY"
          } ],
          "sanctionedStatus" : ""
        }
        "@
        
        # Create Business Application
        
        try {
            $Result = ConvertFrom-JsonToBusinessApplication -Json $BusinessApplication
            New-BusinessApplicationV1 -BusinessApplication $Result 
    
            # Below is a request that includes all optional parameters
            # New-BusinessApplicationV1 -BusinessApplication $Result   
        } catch {
            Write-Host $_.Exception.Response.StatusCode.value__ "Exception occurred when calling New-BusinessApplicationV1"
            Write-Host $_.ErrorDetails
        }
